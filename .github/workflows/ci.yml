name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pickme
          POSTGRES_PASSWORD: pickme
          POSTGRES_DB: pickme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pickme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pickme:pickme@localhost:5432/pickme?schema=public
      JWT_SECRET: ci-secret
      ENABLE_DEV_ROUTES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test -- --passWithNoTests
      - run: npm run test:e2e -- --passWithNoTests
      - run: npm run build

  # FE 로컬 개발 환경(docker compose)이 실제로 뜨는지 확인한다
  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - name: 목데이터·문서·대시보드 확인
        run: |
          curl -fsS localhost:3000/v1/health
          curl -fsS -X POST localhost:3000/v1/dev/tokens | grep -q '"driver"'
          curl -fsS localhost:3000/docs-json | grep -q '"/v1/orders"'
          curl -fsS localhost:3000/dashboard/ | grep -q '픽미 매장 대시보드'
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v
