name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pickme
          POSTGRES_PASSWORD: pickme
          POSTGRES_DB: pickme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pickme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pickme:pickme@localhost:5432/pickme?schema=public
      JWT_SECRET: ci-secret
      ENABLE_DEV_ROUTES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test -- --passWithNoTests
      - run: npm run test:e2e -- --passWithNoTests
      - run: npm run build
